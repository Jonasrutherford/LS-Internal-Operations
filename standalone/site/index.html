<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"></head><body><title>LS Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: an operating console. Persistent live-timer strip on top, rail nav on the left, dense work surfaces on the right. */
:root{
  --bg:#f4f4f9; --panel:#ffffff; --panel-2:#ecebf5; --line:#dad9ea; --line-2:#c7c6de;
  --ink:#0b0d51; --ink-2:#44466f; --ink-3:#72749b;
  --accent:#19169a; --accent-ink:#ffffff; --accent-soft:#e6e5fa;
  --signal:#f25b02; --signal-ink:#ffffff; --flare:#f25b02;
  --good:#1d7f47; --good-soft:#e2f3e8; --warn:#9a5b00; --warn-soft:#fdf0d8; --crit:#c2311d; --crit-soft:#fbe4df;
  --s1:#3d3ad0; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#8a5cc7; --s8:#e34948;
  --div-neg:#c2311d; --div-mid:#b9b8cc; --div-pos:#3d3ad0;
  --f-display:"Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  /* Lucid orange heat ramp, used by every heatmap. */
  --heat-0:#fdf1e9; --heat-1:#f8b588; --heat-2:#f25b02; --heat-3:#b63f00;
  --r:10px; --r-sm:6px;
  --shadow:0 1px 2px rgba(11,13,81,.06), 0 8px 24px rgba(11,13,81,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#08091d; --panel:#10122c; --panel-2:#171a3a; --line:#262a52; --line-2:#343866;
  --ink:#eef0ff; --ink-2:#b4b7dc; --ink-3:#8387b5;
  --accent:#8f8cff; --accent-ink:#0b0d51; --accent-soft:#1f2156;
  --signal:#ff7a2e; --signal-ink:#0b0d51; --flare:#ff7a2e;
  --good:#4cc47f; --good-soft:#12301f; --warn:#f0a73a; --warn-soft:#33260c; --crit:#ff6b57; --crit-soft:#3a1712;
  --s1:#6a67f0; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9d7de0; --s8:#e66767;
  --heat-0:#1d1408; --heat-1:#6b3d14; --heat-2:#ff7a2e; --heat-3:#ffa269;
  --div-neg:#ff6b57; --div-mid:#4a4d74; --div-pos:#8f8cff;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#08091d; --panel:#10122c; --panel-2:#171a3a; --line:#262a52; --line-2:#343866;
  --ink:#eef0ff; --ink-2:#b4b7dc; --ink-3:#8387b5;
  --accent:#8f8cff; --accent-ink:#0b0d51; --accent-soft:#1f2156;
  --signal:#ff7a2e; --signal-ink:#0b0d51; --flare:#ff7a2e;
  --good:#4cc47f; --good-soft:#12301f; --warn:#f0a73a; --warn-soft:#33260c; --crit:#ff6b57; --crit-soft:#3a1712;
  --s1:#6a67f0; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9d7de0; --s8:#e66767;
  --heat-0:#1d1408; --heat-1:#6b3d14; --heat-2:#ff7a2e; --heat-3:#ffa269;
  --div-neg:#ff6b57; --div-mid:#4a4d74; --div-pos:#8f8cff;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
h1,h2,h3,h4{font-family:var(--f-display); margin:0; text-wrap:balance; letter-spacing:-.01em}
h1{font-size:26px; font-weight:600} h2{font-size:18px; font-weight:600} h3{font-size:15px; font-weight:600}
a{color:var(--accent)}
.num,.tab{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono); font-size:12px}
.muted{color:var(--ink-3)} .ink2{color:var(--ink-2)}
.eyebrow{font-family:var(--f-display); font-size:11px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- shell */
.app{display:grid; grid-template-columns:216px minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); min-height:100%}
.strip{grid-column:1/-1; position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--ink); color:var(--bg);
  display:flex; align-items:center; gap:16px; padding:10px 20px; min-height:60px; flex-wrap:wrap}
:root[data-theme="dark"] .strip{background:#04051a; color:var(--ink); border-bottom:1px solid var(--line)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .strip{background:#04051a; color:var(--ink); border-bottom:1px solid var(--line)} }
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.brand svg{height:18px; width:auto; fill:currentColor; flex:none}
.brand b{font-family:var(--f-display); font-weight:600; font-size:15px; letter-spacing:.02em; white-space:nowrap}
.brand b span{opacity:.55; font-weight:500}
.timer{flex:1; display:flex; align-items:center; gap:14px; min-width:0; justify-content:flex-end; flex-wrap:wrap}
.timer .live{display:flex; align-items:center; gap:12px; min-width:0; padding:6px 6px 6px 14px; border-radius:999px; background:rgba(255,255,255,.08)}
.timer.on .live{background:var(--signal); color:var(--signal-ink)}
.timer.paused .live{background:rgba(255,190,0,.22)}
.dot{width:9px; height:9px; border-radius:50%; background:currentColor; opacity:.45; flex:none}
.timer.on .dot{background:var(--flare); opacity:1; animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.6); opacity:.5}}
@media (prefers-reduced-motion: reduce){ .timer.on .dot{animation:none} }
.live .what{min-width:0; display:flex; flex-direction:column; line-height:1.15}
.live .what b{font-family:var(--f-display); font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:34ch}
.live .what small{font-size:11px; opacity:.75; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:40ch}
.clock{font-family:var(--f-display); font-weight:600; font-size:22px; font-variant-numeric:tabular-nums; letter-spacing:.01em; min-width:5.2ch; text-align:right}
.tbtn{border:0; border-radius:999px; padding:7px 13px; font-weight:700; font-size:12.5px; cursor:pointer; background:rgba(255,255,255,.14); color:inherit; white-space:nowrap}
.timer.on .tbtn{background:rgba(11,13,81,.12)}
.timer.on .tbtn.stop{background:var(--signal-ink); color:var(--signal)}
.tbtn.go{background:var(--signal); color:var(--signal-ink)}
.tbtn:hover{filter:brightness(1.08)}
.who{display:flex; align-items:center; gap:8px; font-size:12px; opacity:.9}
.who img{width:24px; height:24px; border-radius:50%}

.rail{background:var(--panel); border-right:1px solid var(--line); padding:16px 10px; display:flex; flex-direction:column; gap:2px; position:sticky; top:60px; align-self:start; height:calc(100vh - 60px); overflow-y:auto}
.rail .grp{margin:14px 10px 4px}
.rail a{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 10px; border-radius:var(--r-sm); color:var(--ink-2); text-decoration:none; font-weight:600; font-size:13.5px}
.rail a:hover{background:var(--panel-2); color:var(--ink)}
.rail a.on{background:var(--accent-soft); color:var(--accent)}
.rail .badge{font-size:11px; font-weight:700; padding:1px 7px; border-radius:999px; background:var(--warn-soft); color:var(--warn)}
.rail .kbd{margin-top:auto; padding:10px; font-size:12px; color:var(--ink-3)}
kbd{font-family:var(--f-mono); font-size:11px; border:1px solid var(--line-2); border-bottom-width:2px; border-radius:4px; padding:0 5px; background:var(--panel-2)}

main{min-width:0; padding-block:22px 60px; padding-inline:clamp(16px,3vw,32px)}
.head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px}
.head p{margin:4px 0 0; color:var(--ink-2); max-width:70ch}
.filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px}

@media (max-width: 860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static; height:auto; flex-direction:row; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line); padding:8px 12px; gap:4px}
  .rail .grp,.rail .kbd{display:none}
  .rail a{white-space:nowrap}
  .strip{padding:10px 16px}
  .timer{justify-content:flex-start}
  .live .what b{max-width:20ch}
  .timer{flex-basis:100%; order:3}
  .timer .live{flex-wrap:wrap; max-width:100%; border-radius:16px}
  .timer .live .what{flex:1 1 60%}
  .who span{display:none}
  .brand{flex:1}
}

/* ---------- surfaces */
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px; min-width:0}
.panel > h3{margin-bottom:10px; display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:1100px){ .g3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:760px){ .g2,.g3,.g-main{grid-template-columns:minmax(0,1fr)} }
.stack{display:flex; flex-direction:column; gap:14px}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.spread{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap}

/* stat bands: numbers grouped by question */
.band{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); border:1px solid var(--line); border-radius:var(--r); background:var(--panel); overflow:hidden}
.band > div{padding:14px 16px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); margin:0 -1px -1px 0; min-width:0}
.band .k{font-size:12px; color:var(--ink-3); font-weight:600}
.band .v{font-family:var(--f-display); font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:2px; white-space:nowrap}
.band .s{font-size:12px; color:var(--ink-2); margin-top:2px}
.band.b4{grid-template-columns:repeat(4,minmax(0,1fr))} .band.b3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){ .band.b4,.band.b3{grid-template-columns:repeat(2,minmax(0,1fr))} }
.band .v small{font-size:13px; font-weight:500; color:var(--ink-2)}
.pace{border-color:var(--accent); background:linear-gradient(180deg, var(--accent-soft), var(--panel) 70%)}
.pace-v{font-family:var(--f-display); font-size:40px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em; margin:2px 0 4px; color:var(--accent)}
.band-title{display:flex; align-items:baseline; gap:10px; margin:22px 0 8px}
.band-title h2{font-size:15px}

.meter{height:8px; background:var(--panel-2); border-radius:999px; position:relative; overflow:hidden; margin-top:8px}
.meter i{position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:999px}
.meter u{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); text-decoration:none}

/* tables */
.tw{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--panel)}
table{border-collapse:collapse; width:100%; font-size:13px}
th{font-family:var(--f-display); font-weight:600; font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3); text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; white-space:nowrap}
td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--panel-2)}
td.r,th.r{text-align:right; font-variant-numeric:tabular-nums}
td.wrap{min-width:180px; max-width:360px}
tfoot td{font-weight:700; border-top:1px solid var(--line-2)}
.sub td{background:var(--panel-2); font-weight:700; font-family:var(--f-display)}

/* chips */
.chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--panel-2); color:var(--ink-2); white-space:nowrap}
.chip.good{background:var(--good-soft); color:var(--good)} .chip.warn{background:var(--warn-soft); color:var(--warn)} .chip.crit{background:var(--crit-soft); color:var(--crit)}
.chip.acc{background:var(--accent-soft); color:var(--accent)}
.chip.sig{background:var(--signal); color:var(--signal-ink)}
.chip.long{white-space:normal} .btn.pick{white-space:normal; text-align:left; width:100%; justify-content:space-between; gap:12px}
.chip .sw{width:8px; height:8px; border-radius:2px}
.code{font-family:var(--f-mono); font-size:11px; color:var(--ink-3)}

/* controls */
.btn{border:1px solid var(--line-2); background:var(--panel); border-radius:var(--r-sm); padding:7px 12px; font-weight:700; font-size:13px; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:6px}
a.btn{text-decoration:none; color:inherit}
a.btn.sig{color:var(--signal-ink)}
.btn:hover{background:var(--panel-2)}
.btn.pri{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sig{background:var(--signal); color:var(--signal-ink); border-color:var(--signal)}
.btn.sm{padding:4px 9px; font-size:12px}
.btn.ghost{border-color:transparent; background:transparent}
.btn.danger{color:var(--crit)}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.in, select.in, textarea.in{border:1px solid var(--line-2); background:var(--panel); border-radius:var(--r-sm); padding:7px 9px; min-width:0; width:100%}
select.in{padding-right:26px}
.in:focus{border-color:var(--accent)}
.field{display:flex; flex-direction:column; gap:4px; min-width:0}
.field > span{font-size:12px; font-weight:700; color:var(--ink-2)}
.field small{color:var(--ink-3); font-size:11.5px}
.fg{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.seg{display:inline-flex; border:1px solid var(--line-2); border-radius:var(--r-sm); overflow:hidden; background:var(--panel)}
.seg button{border:0; background:transparent; padding:6px 11px; font-weight:700; font-size:12.5px; cursor:pointer; color:var(--ink-2)}
.seg button.on{background:var(--accent); color:var(--accent-ink)}
.seg button + button{border-left:1px solid var(--line-2)}
.check{display:flex; align-items:center; gap:8px; font-weight:600; font-size:13px}

/* modal */
.scrim{position:fixed; inset:0; background:rgba(4,5,26,.5); z-index:50; display:flex; align-items:flex-start; justify-content:center; padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px; overflow-y:auto}
.modal{background:var(--panel); border:1px solid var(--line); border-radius:14px; width:min(760px,100%); box-shadow:var(--shadow); display:flex; flex-direction:column}
.modal.wide{width:min(980px,100%)}
.modal header{padding:16px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px}
.modal .body{padding:18px 20px; display:flex; flex-direction:column; gap:16px}
.modal footer{padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap}
.err{color:var(--crit); font-weight:700; font-size:13px}
.note{background:var(--panel-2); border-radius:var(--r-sm); padding:10px 12px; font-size:13px; color:var(--ink-2)}
.note.warn{background:var(--warn-soft); color:var(--warn)}
.note.crit{background:var(--crit-soft); color:var(--crit)}

/* combobox for task types */
.combo{position:relative}
.combo .list{position:absolute; left:0; right:0; top:calc(100% + 4px); background:var(--panel); border:1px solid var(--line-2); border-radius:var(--r-sm); max-height:320px; overflow-y:auto; z-index:5; box-shadow:var(--shadow)}
.combo .fam{padding:7px 10px 3px; font-family:var(--f-display); font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.combo .opt{padding:6px 10px; cursor:pointer; display:flex; justify-content:space-between; gap:10px; font-size:13px}
.combo .opt:hover,.combo .opt.hi{background:var(--accent-soft)}
.combo .opt small{color:var(--ink-3); white-space:nowrap}

/* banners */
.banners{display:flex; flex-direction:column; gap:8px; margin-bottom:14px}
.banner{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 14px; border-radius:var(--r); background:var(--warn-soft); color:var(--warn); font-weight:600}
.banner.info{background:var(--accent-soft); color:var(--accent)}

/* timeline for a day */
.day{position:relative; height:44px; background:var(--panel-2); border-radius:var(--r-sm); overflow:hidden}
.day i{position:absolute; top:6px; bottom:6px; border-radius:4px; min-width:3px}
.day b{position:absolute; top:0; bottom:0; width:1px; background:var(--line-2)}
.day-scale{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-3); margin-top:4px}

.chart{width:100%; height:300px}
.chart.tall{height:380px} .chart.short{height:220px}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); margin-top:6px}
.legend span{display:inline-flex; align-items:center; gap:5px}
.legend i{width:10px; height:10px; border-radius:2px; display:inline-block}

.empty{padding:28px; text-align:center; color:var(--ink-3)}
.toast{position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:999px; font-weight:700; z-index:80; box-shadow:var(--shadow)}
.palette{width:min(560px,100%)}
.palette .opt{padding:9px 14px; cursor:pointer; display:flex; justify-content:space-between}
.palette .opt.hi,.palette .opt:hover{background:var(--accent-soft)}
.gate{max-width:560px; margin:8vh auto; text-align:left}
.gate .people{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-top:16px}
.gate .people button{padding:18px; border-radius:var(--r); border:1px solid var(--line-2); background:var(--panel); cursor:pointer; text-align:left}
.gate .people button:hover{border-color:var(--accent)}
.gate .people b{font-family:var(--f-display); font-size:18px; display:block}
hr.sep{border:0; border-top:1px solid var(--line); margin:4px 0}
.kv{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 16px; font-size:13.5px}
.kv .t{font-weight:800; border-top:1px solid var(--line-2); padding-top:6px}
.kv > span:nth-child(even){text-align:right; font-variant-numeric:tabular-nums}
.alloc{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1.5fr) 90px 130px 32px; gap:8px; align-items:center}
@media (max-width:640px){ .alloc{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }

/* Internal / External segmented control, spec section 8. */
.scope-switch{display:inline-flex;position:relative;border:1px solid var(--line-2);border-radius:999px;
  background:var(--panel-2);padding:3px;margin-top:4px;width:max-content}
.scope-switch .thumb{position:absolute;top:3px;bottom:3px;width:calc(50% - 3px);border-radius:999px;
  background:var(--accent);transition:transform .16s ease;pointer-events:none}
.scope-switch[data-scope="internal"] .thumb{transform:translateX(100%)}
.seg-b{position:relative;z-index:1;border:none;background:none;border-radius:999px;padding:6px 20px;
  font-family:var(--f-display);font-weight:600;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);cursor:pointer;transition:color .16s ease;min-width:104px}
.seg-b.on{color:var(--accent-ink)}
@media (prefers-reduced-motion: reduce){ .scope-switch .thumb{transition:none} }

/* Running / Paused badge on the timer bar, spec section 22. */
.state-pill{font-family:var(--f-display);font-size:10px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
.state-pill.is-running{background:var(--good-soft);color:var(--good)}
.state-pill.is-paused{background:var(--signal);color:var(--signal-ink)}
.timer.paused .clock{opacity:.6}

/* Goal progress bar, Lucid gradient. */

<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* LS Command standalone shim.
 *
 * The app reads its database and identity from the Claude platform via
 * window.claude.use('db') / use('user'). Outside Claude those do not exist, which
 * is why the Vercel build previously showed only a doorway.
 *
 * This provides the same db interface backed by the browser's own storage, so the
 * real app runs on an ordinary web page. use('user') deliberately returns null:
 * the app already handles that by falling back to its own person picker.
 *
 * No business data ships in this file. The repository is public, so revenue, time
 * and payout figures are never committed. Data is loaded by importing a seed file
 * once, and then lives only in this browser.
 */
(function () {
  const KEY = 'lucidos.store.v1';
  const subs = [];
  let store = {};

  const clone = (v) => JSON.parse(JSON.stringify(v));
  const notify = () => subs.forEach((f) => { try { f(); } catch (e) { console.error(e); } });

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify(store));
    } catch (e) {
      // Quota or private browsing. The session keeps working in memory.
      console.warn('Could not persist to this browser:', e && e.message);
    }
  }

  const snapOf = (id, d) => ({ id, exists: !!d, data: () => d, metadata: {} });

  function merge(a, b) {
    for (const k in b) {
      if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object') merge(a[k], b[k]);
      else a[k] = b[k];
    }
    return a;
  }

  const doc = (path) => ({
    id: path.split('/').pop(),
    path,
    get: async () => snapOf(path.split('/').pop(), store[path]),
    set: async (d) => { store[path] = clone(d); persist(); notify(); },
    update: async (d) => {
      if (!store[path]) throw { code: 'invalid_argument' };
      merge(store[path], clone(d));
      persist();
      notify();
    },
    onSnapshot(n) {
      const f = () => n(snapOf(path.split('/').pop(), store[path]));
      subs.push(f);
      setTimeout(f);
      return () => {};
    },
  });

  const collection = (col) => ({
    onSnapshot(n) {
      const f = () => {
        const docs = Object.keys(store)
          .filter((p) => p.split('/').slice(0, -1).join('/') === col)
          .map((p) => snapOf(p.split('/').pop(), store[p]));
        n({ docs, size: docs.length, empty: !docs.length, docChanges: () => [] });
      };
      subs.push(f);
      setTimeout(f);
      return () => {};
    },
    doc: (id) => doc(col + '/' + id),
  });

  window.claude = {
    use: async (name) => (name === 'db' ? { doc, collection } : null),
  };

  /* ---------------------------------------------------------------- data gate */

  function screen(inner) {
    const el = document.createElement('div');
    el.id = 'lucid-gate';
    el.style.cssText =
      'position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;' +
      'background:var(--bg,#08091d);color:var(--ink,#eef0ff);font-family:var(--f-body,system-ui)';
    el.innerHTML =
      '<div style="max-width:440px;width:100%;background:var(--panel,#10122c);border:1px solid var(--line,#262a52);' +
      'border-radius:10px;padding:24px">' + inner + '</div>';
    document.body.appendChild(el);
    return el;
  }

  function askForData() {
    return new Promise((resolve) => {
      const el = screen(
        '<div style="font-family:var(--f-display,system-ui);font-size:11px;font-weight:600;letter-spacing:.09em;' +
        'text-transform:uppercase;color:var(--ink-3,#8387b5)">Lucid Studio</div>' +
        '<h1 style="font-family:var(--f-display,system-ui);margin:4px 0 10px;font-size:22px">Load your data</h1>' +
        '<p style="margin:0 0 16px;font-size:13.5px;color:var(--ink-2,#b4b7dc);line-height:1.5">' +
        'No LS Command data in this browser yet. Load the seed file once and it stays: this screen will not ' +
        'come back on this browser until you wipe it from Settings. The file never leaves your ' +
        'machine and is never committed to the repository.</p>' +
        '<input type="file" accept="application/json,.json" id="lucid-seed-file" style="width:100%">' +
        '<p id="lucid-seed-msg" style="margin:12px 0 0;font-size:13px;color:var(--crit,#ff6b57)"></p>'
      );

      el.querySelector('#lucid-seed-file').addEventListener('change', async (ev) => {
        const file = ev.target.files && ev.target.files[0];
        if (!file) return;
        const msg = el.querySelector('#lucid-seed-msg');
        msg.textContent = '';
        try {
          const parsed = JSON.parse(await file.text());
          const docs = parsed && parsed.documents ? parsed.documents : parsed;
          if (!docs || typeof docs !== 'object' || !Object.keys(docs).length) {
            throw new Error('That file has no documents in it.');
          }
          store = docs;
          persist();
          el.remove();
          resolve();
        } catch (e) {
          msg.textContent = 'Could not read that file: ' + (e && e.message ? e.message : e);
        }
      });
    });
  }

  window.__lucidReady = (async () => {
    try {
      const saved = localStorage.getItem(KEY);
      if (saved) {
        store = JSON.parse(saved);
        if (Object.keys(store).length) return;
      }
    } catch (e) {
      console.warn('Stored data could not be read, asking for it again:', e && e.message);
    }
    await askForData();
  })();

  /* Wipe this browser's copy. Exposed on the page as a button, and callable from
   * the console as __lucidReset(). Asks first, because it cannot be undone from
   * here: the data would have to be loaded again from the seed file. */
  window.__lucidReset = (skipConfirm) => {
    if (!skipConfirm && !confirm('Wipe all LS Command data from this browser? You will need the seed file to load it again.')) return;
    try { localStorage.removeItem(KEY); } catch (e) { /* nothing stored */ }
    location.reload();
  };

  /* Small persistent control, bottom left, out of the way of the app's own UI. */
  function mountWipeControl() {
    if (document.getElementById('lucid-wipe')) return;
    const b = document.createElement('button');
    b.id = 'lucid-wipe';
    b.type = 'button';
    b.textContent = 'Wipe local data';
    b.title = 'Clears the copy of LS Command data stored in this browser';
    b.style.cssText =
      'position:fixed;left:10px;bottom:10px;z-index:9998;font:500 11px/1 var(--f-body,system-ui);' +
      'padding:6px 9px;border-radius:6px;cursor:pointer;opacity:.45;' +
      'color:var(--ink-3,#8387b5);background:var(--panel,#10122c);' +
      'border:1px solid var(--line,#262a52)';
    b.addEventListener('mouseenter', () => { b.style.opacity = '1'; });
    b.addEventListener('mouseleave', () => { b.style.opacity = '.45'; });
    b.addEventListener('click', () => window.__lucidReset());
    document.body.appendChild(b);
  }
  window.__lucidReady.then(mountWipeControl);
})();
</script>
<script>
/* ================================================================ LS Command core */
const S = {
  ready:false, db:null, user:null, mcp:null, dl:null, sample:null,
  me:{id:null, name:'', avatarUrl:'', isOwner:false},
  settings:null, taxonomy:null, clients:{}, people:{},
  entryDocs:{}, fin:{ledger:{},contracts:{},expenses:{}}, timers:{}, payouts:{}, auditDocs:{}, clickup:null,
  personId:null, view:'track', loaded:{}, v:0,
};
const UI = { filters:null, modal:null, charts:[], tick:null, awayAt:null, dismissed:{}, cmdOpen:false };

/* ---------- small utils */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = (p='x') => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const r2 = n => Math.round((+n || 0) * 100) / 100;
const sum = (a, f = x => x) => a.reduce((t, x) => t + (+f(x) || 0), 0);
const groupBy = (a, f) => a.reduce((m, x) => { const k = f(x); (m[k] ||= []).push(x); return m; }, {});
const money = (n, d=0) => (n < 0 ? '-' : '') + '$' + Math.abs(+n || 0).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
const money2 = n => money(n, 2);
const pct = (n, d=0) => isFinite(n) ? (n*100).toFixed(d) + '%' : '–';
const hrs = min => (Math.round((min||0)/6)/10).toFixed(1);           // decimal hours
const hm = min => { min = Math.round(min||0); const h = Math.floor(min/60), m = min%60; return h ? `${h}h ${String(m).padStart(2,'0')}m` : `${m}m`; };
const clockFmt = ms => { const s = Math.max(0, Math.floor(ms/1000)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`; };
const lsGet = (k, d) => { try { const v = localStorage.getItem('lucidos.'+k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem('lucidos.'+k, JSON.stringify(v)); } catch {} };
const clone = o => JSON.parse(JSON.stringify(o ?? null));
function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* ---------- time zone: all business dates live in the company time zone */
const TZ = () => S.settings?.timezone || 'America/Los_Angeles';
const _fmtCache = {};
function zparts(ms){
  const tz = TZ();
  const f = _fmtCache[tz] ||= new Intl.DateTimeFormat('en-CA', {timeZone:tz, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23', weekday:'short'});
  const o = {}; for (const p of f.formatToParts(new Date(ms))) o[p.type] = p.value; return o;
}
const dayKey = ms => { const o = zparts(ms); return `${o.year}-${o.month}-${o.day}`; };
const timeKey = ms => { const o = zparts(ms); return `${o.hour}:${o.minute}`; };
const hourOf = ms => +zparts(ms).hour;
function zoned(dateStr, timeStr){
  const [y,m,d] = dateStr.split('-').map(Number); const [hh,mm] = (timeStr||'00:00').split(':').map(Number);
  const target = Date.UTC(y, m-1, d, hh, mm); let g = target;
  for (let i=0; i<3; i++){ const o = zparts(g); const as = Date.UTC(+o.year, +o.month-1, +o.day, +o.hour, +o.minute); g += target - as; }
  return g;
}
const today = () => dayKey(Date.now());
const monthOf = d => d.slice(0,7);
const addDays = (d, n) => { const t = new Date(d+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); };
const addMonths = (m, n) => { const [y,mm] = m.split('-').map(Number); const t = new Date(Date.UTC(y, mm-1+n, 1)); return t.toISOString().slice(0,7); };
const monthEnd = m => addDays(addMonths(m,1)+'-01', -1);
const daysBetween = (a, b) => Math.round((new Date(b+'T00:00:00Z') - new Date(a+'T00:00:00Z'))/864e5);
const dow = d => new Date(d+'T00:00:00Z').getUTCDay();
const weekStart = d => addDays(d, -((dow(d)+6)%7));   // Monday
const monthLabel = m => new Date(m+'-15T00:00:00Z').toLocaleDateString('en-US', {month:'long', year:'numeric', timeZone:'UTC'});
const monthShort = m => new Date(m+'-15T00:00:00Z').toLocaleDateString('en-US', {month:'short', timeZone:'UTC'});
const dateLabel = d => d ? new Date(d+'T12:00:00Z').toLocaleDateString('en-US', {month:'short', day:'numeric', timeZone:'UTC'}) : '–';
const dateLong = d => d ? new Date(d+'T12:00:00Z').toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', timeZone:'UTC'}) : '–';

/* ---------- lookups */
const person = id => S.people[id] || {name: id || 'Unknown'};
const client = id => S.clients[id];
const clientName = id => id ? (S.clients[id]?.name || id) : 'Unassigned';
const ttype = code => S.taxonomy?.types?.[code];
const typeName = code => code ? (ttype(code)?.name || code) : 'Unclassified';
const famOf = code => ttype(code)?.family || 'none';
const famName = f => S.taxonomy?.families?.[f]?.name || 'Unclassified';
const partners = () => Object.entries(S.people).filter(([,p]) => p.poolMember).map(([id]) => id);
const isPartner = () => !!S.people[S.personId]?.poolMember;
function seriesColor(i){ return getComputedStyle(document.documentElement).getPropertyValue('--s'+((i%8)+1)).trim(); }
function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
const FAMILY_ORDER = () => Object.entries(S.taxonomy?.families||{}).sort((a,b)=>a[1].order-b[1].order).map(([k])=>k);

/* ---------- entries */
function allEntries(){
  if (S._ev === S.v && S._entries) return S._entries;
  const out = [];
  for (const doc of Object.values(S.entryDocs)) for (const e of Object.values(doc.items||{})) if (e && !e.deleted) out.push(e);
  out.sort((a,b) => (b.start||0) - (a.start||0));
  S._entries = out; S._ev = S.v; S._labor = null; return out;
}
/* Each entry becomes one or more labor rows. Active allocations carve minutes out of the session; the rest stays on the primary task.
   Background (AI / machine) allocations are recorded but add no labor minutes. */
function laborRows(){
  if (S._labor && S._lv === S.v) return S._labor;
  const rows = [];
  for (const e of allEntries()){
    if (!e.minutes || e.minutes <= 0) continue;
    const scope = e.scope || (e.clientId === 'internal' ? 'internal' : 'external');
    const base = {entryId:e.id, personId:e.personId, date:e.date, start:e.start, status:e.status, joint:!!e.joint, source:e.source, ai:e.ai, scope, category:e.category||null};
    const allocs = (e.allocations||[]).filter(a => a && a.minutes > 0);
    const active = allocs.filter(a => a.attention !== 'background');
    const used = Math.min(e.minutes, sum(active, a => a.minutes));
    const primaryMin = e.minutes - used;
    if (primaryMin > 0) rows.push({...base, clientId:e.clientId, typeId:e.typeId, family:famOf(e.typeId), minutes:primaryMin, billable:!!e.billable, payoutEligible:e.payoutEligible !== false, primary:true, units:e.units||0});
    for (const a of active){ const t = ttype(a.typeId); rows.push({...base, clientId:a.clientId||e.clientId, typeId:a.typeId, family:famOf(a.typeId), minutes:a.minutes, billable: a.billable ?? (!!t?.billable && !['internal','prospects'].includes(a.clientId||e.clientId)), payoutEligible:e.payoutEligible !== false, primary:false, units:a.units||0}); }
    for (const a of allocs.filter(a => a.attention === 'background')) rows.push({...base, clientId:a.clientId||e.clientId, typeId:a.typeId, family:famOf(a.typeId), minutes:0, bgMinutes:a.minutes, billable:false, payoutEligible:false, primary:false, background:true, units:a.units||0});
  }
  S._labor = rows; S._lv = S.v; return rows;
}
const inRange = (d, from, to) => (!from || d >= from) && (!to || d <= to);

/* ---------- finance helpers */
const ledgerItems = () => Object.values(S.fin.ledger||{}).filter(l => l && !l.deleted);
const contractItems = () => Object.values(S.fin.contracts||{}).filter(c => c && !c.deleted);
const expenseItems = () => Object.values(S.fin.expenses||{}).filter(x => x && !x.deleted);
const FREQ_M = {monthly:1, quarterly:3, semiannual:6, annual:12};
const STATUS_LABEL = {draft:'Draft', contracted:'Contracted', invoiced:'Invoiced', ar:'Accounts receivable', partial:'Partially paid', paid:'Paid', written_off:'Written off'};
const BASIS_LABEL = {cash:'Cash collected', recognized:'Revenue recognized', paid_ar:'Paid plus accounts receivable', custom:'Manually approved amount'};

function paidIn(l, from, to){ return ['paid','partial'].includes(l.status) && l.paidDate && inRange(l.paidDate, from, to) ? (+l.paidAmount || (l.status==='paid' ? +l.amount : 0)) : 0; }
function outstanding(l){ return ['invoiced','ar','partial'].includes(l.status) ? Math.max(0, (+l.amount||0) - (+l.paidAmount||0)) : 0; }

/* Revenue for one payment period on the chosen basis. Returns the lines used, so every payout traces to ledger rows. */
function periodRevenue(m, basis){
  const from = m+'-01', to = monthEnd(m); const lines = [];
  if (basis === 'custom'){
    const amt = +(S.settings.customAmounts||{})[m] || 0;
    return {eligible:amt, other:0, lines:[], custom:true};
  }
  for (const l of ledgerItems()){
    let amt = 0, why = '';
    if (basis === 'cash'){ amt = paidIn(l, from, to); why = 'paid ' + dateLabel(l.paidDate); }
    else if (basis === 'recognized'){ if (l.recognitionDate && inRange(l.recognitionDate, from, to) && !['draft','written_off','contracted'].includes(l.status)){ amt = +l.amount||0; why = 'recognized ' + dateLabel(l.recognitionDate); } }
    else if (basis === 'paid_ar'){
      const p = paidIn(l, from, to); if (p){ amt = p; why = 'paid ' + dateLabel(l.paidDate); }
      else if (['invoiced','ar','partial'].includes(l.status) && l.invoiceDate && inRange(l.invoiceDate, from, to)){ amt = outstanding(l); why = 'A/R, invoiced ' + dateLabel(l.invoiceDate); }
    }
    if (amt) lines.push({...l, used:amt, why});
  }
  return {eligible: r2(sum(lines.filter(l => l.poolEligible !== false), l => l.used)), other: r2(sum(lines.filter(l => l.poolEligible === false), l => l.used)), lines};
}
/* Expense occurrences in a date range: one-time rows by date, recurring rules expanded by frequency. */
function expensesIn(from, to){
  const out = [];
  for (const x of expenseItems()){
    if (!x.recurring){ if (x.date && inRange(x.date, from, to)) out.push({...x, on:x.date}); continue; }
    const step = FREQ_M[x.frequency] || 1; let d = x.date; let guard = 0;
    while (d && d <= to && guard++ < 400){
      if (d >= from && (!x.endDate || d <= x.endDate)) out.push({...x, on:d});
      if (x.endDate && d > x.endDate) break;
      const nm = addMonths(d.slice(0,7), step); const day = Math.min(+x.date.slice(8,10), +monthEnd(nm).slice(8,10));
      d = nm + '-' + String(day).padStart(2,'0');
    }
  }
  return out;
}
/* Split cents so individual payouts sum to the pool exactly (largest remainder). */
function splitCents(total, weights){
  const cents = Math.round(total*100), W = sum(weights);
  if (!W) return weights.map(() => 0);
  const raw = weights.map(w => cents * w / W), base = raw.map(Math.floor);
  let left = cents - sum(base);
  raw.map((v,i) => [v - base[i], i]).sort((a,b) => b[0]-a[0]).forEach(([,i]) => { if (left > 0){ base[i]++; left--; } });
  return base.map(c => c/100);
}
function hoursFor(m, personId){
  const from = m+'-01', to = monthEnd(m);
  const rows = laborRows().filter(r => r.personId === personId && inRange(r.date, from, to) && r.payoutEligible);
  return { approved: sum(rows, r => r.minutes), pending: 0 };
}
/* Payouts.
 *
 * Two regimes, because the split changed:
 *   through 2026-09  fixed shares of total revenue, Carter 40% and Jonas 30%
 *   from   2026-10   a 65% pool, divided by each partner's share of approved hours
 *
 * fixedSplit in settings holds the old percentages so historical months stay
 * truthful instead of being recomputed under today's rules. */
function splitRegime(m){
  const st = S.settings;
  const cutover = st.hoursBasedFrom || '2026-10';
  return m < cutover ? 'fixed' : 'hours';
}
function payoutFor(m){
  const st = S.settings; const basis = st.revenueBasis;
  const regime = splitRegime(m);
  const p = regime === 'fixed'
    ? sum(Object.values(st.fixedSplit || {}))
    : +st.poolPct;
  const rev = periodRevenue(m, basis);
  const exp = expensesIn(m+'-01', monthEnd(m));
  const expTotal = r2(sum(exp, x => x.amount)), overhead = r2(sum(exp.filter(x => x.allocation !== 'client'), x => x.amount)), direct = r2(expTotal - overhead);
  const poolBase = st.expenseTiming === 'before' ? Math.max(0, rev.eligible - expTotal) : rev.eligible;
  const pool = r2(poolBase * p);
  const ids = partners();
  const hrsBy = ids.map(id => ({id, ...hoursFor(m, id)}));
  const totalMin = sum(hrsBy, h => h.approved);

  /* Fixed regime pays the agreed percentage of revenue regardless of hours.
     Hours regime divides the pool by each partner's share of approved hours. */
  const weights = regime === 'fixed'
    ? ids.map(id => (st.fixedSplit || {})[id] || 0)
    : hrsBy.map(h => h.approved);
  const pays = splitCents(pool, weights);

  const people = hrsBy.map((h,i) => {
    const share = regime === 'fixed'
      ? ((st.fixedSplit || {})[h.id] || 0) / (p || 1)
      : (totalMin ? h.approved/totalMin : 0);
    return {...h, share, payout: pays[i], perHour: h.approved ? pays[i] / (h.approved/60) : 0};
  });
  const retained = r2(rev.eligible - pool);
  const contribution = st.expenseTiming === 'before' ? r2(rev.eligible - expTotal - pool) : r2(retained - expTotal);
  return {m, basis, pct:p, regime, rev, exp, expTotal, overhead, direct, poolBase:r2(poolBase), pool, people, totalMin,
          unallocated: (regime === 'hours' && !totalMin) ? pool : 0,
          retained, contribution, reconstructed: m <= (st.reconstructedThrough||''), locked: S.payouts[m]?.locked ? S.payouts[m] : null};
}

/* ---------- contracts */
function billingDates(c, from, to){
  const out = []; if (!c.start) return out;
  const step = FREQ_M[c.frequency] || 1; let m = c.start.slice(0,7); const bday = +(c.billingDay || c.start.slice(8,10)); let guard = 0;
  while (guard++ < 400){
    const d = m + '-' + String(Math.min(bday, +monthEnd(m).slice(8,10))).padStart(2,'0');
    if (d > to || (c.end && d > c.end)) break;
    if (d >= from && d >= c.start) out.push(d);
    m = addMonths(m, step);
  }
  return out;
}
const isActiveContract = c => ['active','pending','renewing'].includes(c.lifecycle);
function contractFuture(c, to){ if (!isActiveContract(c)) return {dates:[], amount:0}; const dates = billingDates(c, addDays(today(),1), to || c.end || addDays(today(), 365)); return {dates, amount: r2(dates.length * (+c.amount||0))}; }
/* 12-month pace, zero churn: every active retainer (plus signed ones starting within 31 days) runs all 12 months,
   and one-off project revenue continues at its trailing-90-day rate. End dates are ignored on purpose: zero churn means everyone renews. */
function runRate(){
  const t = today(), soon = addDays(t, 31), from90 = addDays(t, -89);
  const retainers = contractItems().filter(c => isActiveContract(c) && c.start <= soon && ['retainer','ad fee','hourly'].includes(c.contractType))
    .map(c => ({c, monthly: r2((+c.amount||0) / (FREQ_M[c.frequency]||1)), starts: c.start > t ? c.start : null}));
  const recurringMonthly = r2(sum(retainers, r => r.monthly));
  const oneOffLines = ledgerItems().filter(l => l.poolEligible !== false && l.revenueType !== 'retainer' && paidIn(l, from90, t));
  const oneOff90 = r2(sum(oneOffLines, l => paidIn(l, from90, t)));
  const oneOffAnnual = r2(oneOff90 * 365 / 90);
  return {retainers, recurringMonthly, recurringAnnual: r2(recurringMonthly*12), oneOff90, oneOffAnnual, oneOffLines, from90,
          total: r2(recurringMonthly*12 + oneOffAnnual), monthly: r2(recurringMonthly + oneOffAnnual/12)};
}
function mrr(){ const t = today(); return r2(sum(contractItems().filter(c => isActiveContract(c) && c.start <= t && (!c.end || c.end >= t)), c => (+c.amount||0) / (FREQ_M[c.frequency]||1))); }

/* ---------- data-quality checks (used by Review and the rail badge) */
function reviewItems(){
  if (S._rev && S._rvv === S.v) return S._rev;
  const E = allEntries(), me = S.personId, st = S.settings || {};
  const out = {mapping:[], units:[], overlap:[], long:[], approve:[], drafts:[], orphanRev:[], revStatus:[], dupes:[], contracts:[], expenses:[], noClient:[]};
  for (const e of E){
    if (e.needsReview) out.mapping.push(e);
    else if (!e.clientId || !e.typeId) out.noClient.push(e);
    if (e.source !== 'import' && e.status !== 'draft' && ttype(e.typeId)?.cls === 'revenue' && !(e.units > 0)) out.units.push(e);
    if (e.minutes > (st.longTimerHours||3)*60*1.7) out.long.push(e);
    if (e.status === 'submitted' && e.personId !== me && isPartner()) out.approve.push(e);
    if (e.status === 'draft' && e.personId === me) out.drafts.push(e);
  }
  // overlaps: same person, time ranges intersect
  const byP = groupBy(E.filter(e => e.start && e.end), e => e.personId);
  for (const list of Object.values(byP)){
    const s = [...list].sort((a,b) => a.start - b.start);
    for (let i=1; i<s.length; i++){
      for (let j=i-1; j>=0 && j>=i-4; j--){
        const a = s[j], b = s[i];
        if (b.start < a.end){
          const ov = Math.round((Math.min(a.end,b.end) - b.start)/60000);
          const same = a.start === b.start && a.end === b.end;
          if (ov >= 1) (same ? out.dupes : out.overlap).push({a, b, minutes:ov});
        }
      }
    }
  }
  for (const l of ledgerItems()){
    if (l.revenueType !== 'other income' && !l.clientId) out.orphanRev.push({l, why:'No client'});
    else if (l.revenueType === 'retainer' && !l.contractId) out.orphanRev.push({l, why:'Retainer payment not linked to a contract'});
    if (l.status === 'paid' && !l.paidDate) out.revStatus.push({l, why:'Marked paid with no payment date'});
    if (['ar','invoiced'].includes(l.status) && l.paidDate) out.revStatus.push({l, why:'Has a payment date but is still open'});
    if (['ar','invoiced'].includes(l.status) && l.invoiceDate && daysBetween(l.invoiceDate, today()) > 45) out.revStatus.push({l, why:`Open for ${daysBetween(l.invoiceDate, today())} days`});
    if (l.status === 'partial' && !(+l.paidAmount > 0)) out.revStatus.push({l, why:'Partially paid with no paid amount'});
  }
  for (const c of contractItems()){
    if (c.needsReview) out.contracts.push({c, why:(c.reviewNotes||[]).join(' ') || 'Flagged for review'});
    else if (isActiveContract(c) && (!c.end || !c.renewalDate)) out.contracts.push({c, why:'Missing end or renewal date'});
  }
  for (const x of expenseItems()) if (x.needsReview) out.expenses.push({x, why:(x.reviewNotes||[]).join(' ') || 'Flagged for review'});
  out.total = out.mapping.length + out.noClient.length + out.units.length + out.overlap.length + out.approve.length + out.orphanRev.length + out.revStatus.length + out.dupes.length + out.contracts.length + out.expenses.length;
  S._rev = out; S._rvv = S.v; return out;
}

/* ---------- benchmarks: only approved, structured entries with a unit count */
function quant(a, q){ if (!a.length) return null; const s = [...a].sort((x,y)=>x-y); const pos = (s.length-1)*q, lo = Math.floor(pos), hi = Math.ceil(pos); return s[lo] + (s[hi]-s[lo])*(pos-lo); }
function benchmarks(){
  if (S._bm && S._bv === S.v) return S._bm;
  const by = {};
  for (const r of laborRows()){
    if (!(r.units > 0) || !r.typeId || r.background) continue;
    const e = entryById(r.entryId);
    (by[r.typeId] ||= []).push({perUnit: r.minutes / r.units, units:r.units, minutes:r.minutes, ai: e?.ai && e.ai !== 'none', complexity: e?.complexity, revision: +e?.revision||0, date:r.date});
  }
  const out = {};
  for (const [code, xs] of Object.entries(by)){
    const v = xs.map(x => x.perUnit), mean = sum(v)/v.length;
    const sd = Math.sqrt(sum(v, x => (x-mean)**2) / Math.max(1, v.length-1));
    const ai = xs.filter(x => x.ai).map(x => x.perUnit), noai = xs.filter(x => !x.ai).map(x => x.perUnit);
    out[code] = {n:xs.length, units:sum(xs, x=>x.units), minutes:sum(xs, x=>x.minutes), mean, median:quant(v,.5), p25:quant(v,.25), p75:quant(v,.75), p90:quant(v,.9), sd,
      aiMedian: quant(ai,.5), aiN: ai.length, noAiMedian: quant(noai,.5), noAiN: noai.length, xs,
      confidence: xs.length < 5 ? 'Preliminary' : xs.length < 15 ? 'Medium' : 'High'};
  }
  S._bm = out; S._bv = S.v; return out;
}
function entryById(id){ for (const d of Object.values(S.entryDocs)) if (d.items?.[id]) return d.items[id]; return null; }

/* ---------- writes */
async function upsertItem(col, docId, itemId, obj){
  const ref = S.db.doc(col+'/'+docId);
  try { await ref.update({items:{[itemId]: obj}}); }
  catch (e){
    if (e?.code === 'invalid_argument'){ const snap = await ref.get(); if (!snap.exists){ await ref.set({items:{[itemId]: obj}}); return; } }
    throw e;
  }
}
async function audit(entity, entityId, changes, reason, extra={}){
  const m = today().slice(0,7), id = uid('a');
  try { await upsertItem('audit', m, id, {id, ts:Date.now(), personId:S.personId, userId:S.me.id, entity, entityId, changes, reason:reason||'', ...extra}); } catch(e){ console.warn('audit failed', e); }
}
function diff(before, after, fields){
  const ch = [];
  for (const f of fields){ const a = before?.[f] ?? null, b = after?.[f] ?? null; if (JSON.stringify(a) !== JSON.stringify(b)) ch.push({field:f, from:a, to:b}); }
  return ch;
}
const ENTRY_FIELDS = ['personId','date','start','end','minutes','clientId','typeId','units','unitType','stage','complexity','ai','revision','billable','cls','payoutEligible','allocations','note','status','clickupTaskId','joint'];
const PAYOUT_FIELDS = ['personId','date','minutes','payoutEligible','status','allocations'];
function isLocked(m){ return !!S.payouts[m]?.locked; }

async function saveEntry(e, reason){
  const prev = e.id ? entryById(e.id) : null;
  const m = monthOf(e.date);
  if (isLocked(m) || (prev && isLocked(monthOf(prev.date)))) throw new Error(`${monthLabel(isLocked(m) ? m : monthOf(prev.date))} is locked. Unlock the payment period on Payouts first.`);
  e.id ||= uid('e'); e.updatedAt = Date.now(); e.updatedBy = S.personId; e.createdAt ||= Date.now(); e.createdBy ||= S.personId;
  if (prev && monthOf(prev.date) !== m){ await upsertItem('entries', monthOf(prev.date), e.id, {...prev, deleted:true, movedTo:m}); }
  await upsertItem('entries', m, e.id, e);
  const ch = diff(prev, e, ENTRY_FIELDS);
  const payoutImpact = prev && (prev.status === 'approved' || e.status === 'approved') && diff(prev, e, PAYOUT_FIELDS).length;
  if (!prev) await audit('entry', e.id, [{field:'created', from:null, to:`${hm(e.minutes)} ${typeName(e.typeId)}`}], reason, {month:m});
  else if (ch.length) await audit('entry', e.id, ch, reason, {month:m, payoutImpact:!!payoutImpact});
  return e;
}
async function saveFin(kind, item, reason, fields){
  const prev = S.fin[kind]?.[item.id] || null;
  item.id ||= uid(kind.slice(0,3)); item.updatedAt = Date.now(); item.updatedBy = S.personId;
  await S.db.doc('fin/'+kind).update({items:{[item.id]: item}}).catch(async e => {
    if (e?.code === 'invalid_argument'){ const s = await S.db.doc('fin/'+kind).get(); if (!s.exists) return S.db.doc('fin/'+kind).set({items:{[item.id]: item}}); }
    throw e;
  });
  const ch = prev ? diff(prev, item, fields) : [{field:'created', from:null, to: item.amount != null ? money2(item.amount) : ''}];
  if (ch.length) await audit(kind, item.id, ch, reason, {payoutImpact: kind !== 'contracts'});
  return item;
}
async function saveConfig(doc, patch, reason, label){
  const before = clone(doc === 'settings' ? S.settings : null);
  await S.db.doc('config/'+doc).update(patch);
  if (doc === 'settings'){ const ch = Object.keys(patch).map(k => ({field:k, from:before?.[k] ?? null, to:patch[k]})); await audit('settings', 'settings', ch, reason, {payoutImpact: ['poolPct','revenueBasis','expenseTiming','customAmounts'].some(k => k in patch)}); }
  else await audit(doc, doc, [{field: label || 'updated', from:null, to:null}], reason);
}

function subscribe(){
  const onErr = e => console.warn('db', e);
  const bump = () => { S.v++; scheduleRender(); };
  S.db.collection('config').onSnapshot(snap => {
    for (const d of snap.docs){ const x = d.data(); if (d.id === 'settings') S.settings = x; else if (d.id === 'taxonomy') S.taxonomy = x; else if (d.id === 'clients') S.clients = x.items||{}; else if (d.id === 'people') S.people = x.items||{}; }
    S.loaded.config = true; resolveIdentity(); bump();
  }, onErr);
  S.db.collection('entries').onSnapshot(snap => { S.entryDocs = {}; for (const d of snap.docs) S.entryDocs[d.id] = d.data(); S.loaded.entries = true; bump(); }, onErr);
  S.db.collection('fin').onSnapshot(snap => { for (const d of snap.docs) S.fin[d.id] = d.data().items||{}; S.loaded.fin = true; bump(); }, onErr);
  S.db.collection('timers').onSnapshot(snap => { S.timers = {}; for (const d of snap.docs) S.timers[d.id] = d.data(); bump(); renderTimer(); }, onErr);
  S.db.collection('payouts').onSnapshot(snap => { S.payouts = {}; for (const d of snap.docs) S.payouts[d.id] = d.data(); bump(); }, onErr);
  S.db.collection('audit').onSnapshot(snap => { S.auditDocs = {}; for (const d of snap.docs) S.auditDocs[d.id] = d.data(); if (S.view === 'audit') bump(); }, onErr);
}
function resolveIdentity(){
  if (S.personId && S.people[S.personId]) return;
  const hit = Object.entries(S.people).find(([,p]) => p.userId && p.userId === S.me.id);
  if (hit){ S.personId = hit[0]; return; }
  if (!S.me.id){ S.personId = lsGet('actingAs', null); }
}
async function claimPerson(pid){
  if (!S.me.id){ lsSet('actingAs', pid); S.personId = pid; S.v++; scheduleRender(); return; }
  const p = S.people[pid]; if (p.userId && p.userId !== S.me.id && !S.me.isOwner){ toast(`${p.name} is already linked to another account`); return; }
  await S.db.doc('config/people').update({items:{[pid]:{userId:S.me.id}}});
  await audit('people', pid, [{field:'userId', from:p.userId||null, to:'linked'}], 'Linked sign-in to person');
  S.personId = pid; toast(`Signed in as ${p.name}`);
}

  }
  if (UI.awayPrompt && t?.running) out.push(`<div class="banner info"><span>You were away ${hm(UI.awayPrompt.minutes)} while the timer ran. Were you working?</span><span class="row"><button class="btn sm" data-act="away-keep">Yes, keep it</button><button class="btn sm pri" data-act="away-drop">Remove ${hm(UI.awayPrompt.minutes)}</button></span></div>`);
  if (st.workHours?.enabled && !t?.running && !UI.dismissed.work){
    const o = zparts(Date.now()); const d = ({Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6})[o.weekday]; const now = `${o.hour}:${o.minute}`;
    if ((st.workHours.days||[]).includes(d) && now >= st.workHours.start && now <= st.workHours.end) out.push(`<div class="banner info"><span>It's inside your working hours and nothing is being tracked.</span><span class="row"><button class="btn sm" data-act="dismiss" data-k="work">Not working now</button><button class="btn sm pri" data-act="start">Start timer</button></span></div>`);
  }

/* ================================================================ timer */
function elapsedMs(t, at=Date.now()){ if (!t?.running) return 0; return at - t.start - (t.pausedMs||0) - (t.pausedAt ? at - t.pausedAt : 0); }
function renderTimer(){
  const el = $('#timer'); if (!el || !S.personId) return;
  const t = S.timers[S.personId];
  if (!t?.running){
    el.className = 'timer';
    el.innerHTML = `<div class="live"><span class="dot"></span><div class="what"><b>No timer running</b><small>Start one to capture time as you work</small></div><button class="tbtn go" data-act="start">Start timer</button></div><button class="tbtn" data-act="log">Log time</button>`;
    return;
  }
  const paused = !!t.pausedAt;
  el.className = 'timer on' + (paused ? ' paused' : '');
  /* Paused state, spec section 22: say plainly that it is paused, make Resume the
   * obvious next action, and keep Stop reachable. Switch is gone, section 15. */
  el.innerHTML = `<div class="live"><span class="dot"></span>
    <div class="what">
      <b>${esc(t.taskName || typeName(t.typeId))}</b>
      <small>${esc(t.scope === 'internal' ? 'Internal' : clientName(t.clientId))}${t.category ? ' · ' + esc(t.category) : ''}</small>
    </div>
    <span class="state-pill ${paused?'is-paused':'is-running'}">${paused ? 'Paused' : 'Running'}</span>
    <span class="clock" id="clock">${clockFmt(elapsedMs(t))}</span>
    <button class="tbtn ${paused?'go':''}" data-act="${paused?'resume':'pause'}">${paused?'Resume':'Pause'}</button>
    <button class="tbtn stop" data-act="stop">Stop</button></div>`;
}
function tick(){
  const t = S.timers[S.personId]; const c = $('#clock');
  if (t?.running && c) c.textContent = clockFmt(elapsedMs(t));
  if (t?.running){ const m = Math.floor(elapsedMs(t)/60000); document.title = `${clockFmt(elapsedMs(t)).slice(0,-3)} · ${t.taskName || typeName(t.typeId)} · LS Command`; if (m && m % 30 === 0 && new Date().getSeconds() === 0) maybeNotify(t, m); }
  else if (document.title !== 'LS Command') document.title = 'LS Command';
}
function maybeNotify(t, m){
  const st = S.settings; if (m < (st.longTimerHours||3)*60) return;
  try { if (window.Notification?.permission === 'granted') new Notification('LS Command timer still running', {body:`${hm(m)} on ${typeName(t.typeId)}`}); } catch {}
}
function onVisibility(){
  const t = S.timers[S.personId];
  if (document.hidden){ UI.awayAt = Date.now(); return; }
  if (UI.awayAt && t?.running && !t.pausedAt){
    const away = (Date.now() - UI.awayAt)/60000;
    if (away >= (S.settings.idleMinutes||30)){ UI.awayPrompt = {from:UI.awayAt, minutes:Math.round(away)}; scheduleRender(); }
  }
  UI.awayAt = null;
}
async function timerSet(patch){ await S.db.doc('timers/'+S.personId).set({...(S.timers[S.personId]||{}), ...patch, updatedAt:Date.now(), device:navigator.userAgent.slice(0,60)}); }
async function startTimer(d){
  if (S.timers[S.personId]?.running){ toast('A timer is already running. Use Switch.'); return; }
  await timerSet({running:true, start:Date.now(), pausedMs:0, pausedAt:null, scope:d.scope||'external', clientId:d.clientId, categoryId:d.categoryId||null, typeId:d.typeId||null, taskName:d.taskName||null, note:''});
  toast('Timer started');
}
async function pauseTimer(){ const t = S.timers[S.personId]; if (t?.running && !t.pausedAt) await timerSet({pausedAt:Date.now()}); }
async function resumeTimer(){ const t = S.timers[S.personId]; if (t?.pausedAt) await timerSet({pausedMs:(t.pausedMs||0) + (Date.now()-t.pausedAt), pausedAt:null}); }
/* Stop, spec section 17. Person, date, start, end, client and task are already
 * known, so none of them are asked for again. Only genuinely new facts appear. */
function stopTimer(){
  const t = S.timers[S.personId]; if (!t?.running) return;
  const end = t.pausedAt || Date.now();
  const ty = ttype(t.typeId);
  openEntryEditor({
    personId:S.personId, date:dayKey(t.start), start:t.start, end,
    pausedMin: Math.round((t.pausedMs||0)/60000),
    scope:t.scope||'external', clientId:t.clientId, categoryId:t.categoryId||null,
    typeId:t.typeId, taskName:t.taskName||null, note:'', unitType:ty?.unit||null,
    billable: defaultBillable(t.typeId, t.clientId), payoutEligible: ty?.payoutEligible !== false,
    cls: ty?.cls || null, status:'draft', source:'lucid',
  }, {fromTimer:true});
}

/* task type combobox: grouped by service family, type to filter */
function typeCombo(id, value){

}
function comboList(id, q){
  const box = $(`[data-combo="${id}"] .list`); q = (q||'').toLowerCase().trim();

/* Work classification. Categories and task types both carry a scope, so internal
 * logging can never surface external work and the reverse holds too. The taxonomy
 * is data, editable in System Admin, not a list hard-coded here. */
const CATS = () => Object.values(S.taxonomy.categories || {}).filter(c => c.active !== false).sort((a,b) => a.order - b.order);
const categoriesFor = scope => CATS().filter(c => c.scope === scope || c.scope === 'both');
const catName = id => (S.taxonomy.categories || {})[id]?.name || '';
const catOf = typeId => ttype(typeId)?.categoryId || null;
/* Scope of a logged row: explicit first, then the task type, then the category. */
function scopeOfType(typeId){
  const t = ttype(typeId); if (!t) return null;
  return t.scope || (S.taxonomy.categories || {})[t.categoryId]?.scope || null;
}
function typesFor(scope, categoryId){
  return Object.values(S.taxonomy.types || {})
    .filter(t => t.active !== false
      && (t.scope === scope || t.scope === 'both')
      && (!categoryId || t.categoryId === categoryId || t.categoryId == null))
    .sort((a,b) => (a.order - b.order) || a.name.localeCompare(b.name));
}

/* Clients and Leads only. Internal is a scope and never appears as a client. */
function partyOptions(sel){
  const entries = Object.entries(S.clients).filter(([id,c]) =>
    id !== 'internal' && c.kind !== 'internal' && (c.active !== false || id === sel));
  const isLead = ([id,c]) => id === 'prospects' || c.kind === 'lead';
  const group = (label, list) => list.length
    ? `<optgroup label="${label}">${list.map(([id,c]) => `<option value="${id}" ${id===sel?'selected':''}>${esc(c.name)}</option>`).join('')}</optgroup>` : '';
  const byName = (a,b) => a[1].name.localeCompare(b[1].name);
  return `<option value="">Choose…</option>`
    + group('Clients', entries.filter(e => !isLead(e)).sort(byName))
    + group('Leads',   entries.filter(isLead).sort(byName));
}

function readEditor(){

async function saveEditor(mode){

  if (!e.date || !e.start || !e.end || !(e.minutes > 0)) return err.textContent = 'Set a date, start and end time.';
  if (!e.clientId || !e.typeId) return err.textContent = 'Choose a client and a task type.';
  const active = sum((e.allocations||[]).filter(a => a.attention !== 'background'), a => a.minutes);
  if (active > e.minutes) return err.textContent = `Split minutes (${active}) are more than the session (${e.minutes}). One person can't log more labor than elapsed time.`;
  // overlap guard: the same person cannot hold two full sessions in the same minutes
  const clash = allEntries().find(x => x.personId === e.personId && x.id !== e.id && x.id !== UI.edit.mergeDelete && x.start && x.end && x.start < e.end && e.start < x.end);

  let reason = $('#ed-reason')?.value?.trim() || '';

  if (mode === 'submit') e.status = S.settings.approvalMode === 'self' ? 'approved' : 'submitted';
  else if (!prev || prev.status !== 'approved') e.status = 'draft';
  if (prev?.status === 'approved' && prev.personId === S.personId && S.settings.approvalMode !== 'self') e.status = 'submitted';   // your own change to approved time goes back for approval
  if (e.status === 'approved'){ e.approvedBy ||= S.personId; e.approvedAt ||= Date.now(); }

  e.source ||= 'lucid';
  const mergeFrom = UI.edit.mergeDelete; delete e._mergeFrom;
  if (mergeFrom && prev?.status === 'approved' && !reason) reason = 'Merged overlapping entries';
  try { await saveEntry(e, reason);
    if (mergeFrom){ const o = entryById(mergeFrom); if (o){ await upsertItem('entries', monthOf(o.date), o.id, {...o, deleted:true, mergedInto:e.id}); await audit('entry', o.id, [{field:'merged into', from:null, to:e.id}], reason || 'Merged overlapping entries', {payoutImpact:o.status==='approved'}); } }

  const {opts} = UI.edit; closeModal();
  if (opts.fromTimer){ await S.db.doc('timers/'+S.personId).set({running:false, updatedAt:Date.now()}); UI.awayPrompt = null; UI.dismissed.long = false; }
  toast(e.status === 'submitted' ? 'Saved and submitted for approval' : e.status === 'approved' ? 'Saved' : 'Saved as draft');
}

/* ================================================================ Performance */
/* Company scoreboard, spec sections 29 and 30. Operational visibility, not a
 * ranking: where time goes, internal against external, and how close estimates
 * land. Standard deviation needs at least two samples or it means nothing. */

function scopeSplit(rows){
  const ext = rows.filter(r => r.scope !== 'internal');
  const int = rows.filter(r => r.scope === 'internal');
  return {ext, int, extMin: sum(ext, r => r.minutes), intMin: sum(int, r => r.minutes)};
}

/* Estimated against actual, per task type, spec section 30. Types with no planning
 * estimate are skipped rather than given an invented one. */
function varianceRows(rows){
  const byType = groupBy(rows.filter(r => r.typeId), r => r.typeId);
  const out = [];
  for (const [typeId, rs] of Object.entries(byType)){
    const ty = ttype(typeId);
    const estHours = ty?.hours;
    if (!estHours) continue;
    const byEntry = Object.values(groupBy(rs, r => r.entryId)).map(g => sum(g, r => r.minutes) / 60);
    const n = byEntry.length;
    const est = estHours;
    const deltas = byEntry.map(h => h - est);
    const mean = sum(deltas) / n;
    const sd = n < 2 ? null : Math.sqrt(sum(deltas.map(d => (d - mean) ** 2)) / (n - 1));
    out.push({typeId, name: typeName(typeId), n, est, actual: r2(sum(byEntry)/n),
              variance: r2(mean), variancePct: est ? r2(mean/est*100) : null, sd: sd == null ? null : r2(sd)});
  }
  return out.sort((a,b) => Math.abs(b.variance) - Math.abs(a.variance));
}

/* ================================================================ CLIENTS */
function clientPL(from, to){
  const rows = laborRows().filter(r => inRange(r.date, from, to));
  const pays = monthsIn(from, to).map(payoutFor);
  const pool = sum(pays, p => p.pool), poolMin = sum(pays, p => p.totalMin);
  const rate = poolMin ? pool / (poolMin/60) : 0;            // effective payout per labor hour in this range
  const exp = expensesIn(from, to).filter(x => x.allocation === 'client');
  const ids = new Set([...Object.keys(S.clients), ...rows.map(r=>r.clientId).filter(Boolean)]);
  const out = [];
  for (const id of ids){
    const c = S.clients[id]; if (c?.kind === 'internal') continue;
    const L = ledgerItems().filter(l => l.clientId === id);
    const paid = r2(sum(L, l => paidIn(l, from, to)));
    const recog = r2(sum(L.filter(l => l.recognitionDate && inRange(l.recognitionDate, from, to) && !['draft','written_off','contracted'].includes(l.status)), l => +l.amount||0));
    const ar = r2(sum(L, outstanding));
    const fut = r2(sum(contractItems().filter(k => k.clientId === id), k => contractFuture(k).amount));
    const direct = r2(sum(exp.filter(x => x.clientId === id), x => x.amount));
    const cr = rows.filter(r => r.clientId === id); const min = sum(cr, r => r.minutes);
    const laborCost = r2(min/60 * rate);
    const contrib = r2(paid - laborCost - direct);
    const units = sum(cr, r => r.units||0);
    const con = contractItems().find(k => k.clientId === id && isActiveContract(k));
    const monthMin = sum(laborRows().filter(r => r.clientId===id && r.date.startsWith(today().slice(0,7))), r=>r.minutes);
    if (!paid && !min && !ar && !fut) continue;
    out.push({id, name:clientName(id), paid, recog, ar, fut, direct, min, laborCost, contrib, margin: paid ? contrib/paid : null, perHour: min ? paid/(min/60) : null, units,
      planned: con?.plannedMonthlyHours || null, monthMin, fams: groupBy(cr, r => r.family)});
  }
  return {rows: out.sort((a,b) => b.paid - a.paid || b.min - a.min), rate};
}

  </tbody><tfoot><tr><td>Total</td><td class="r num">${money2(sum(ytd,p=>p.rev.eligible))}</td><td class="r num">${money2(sum(ytd,p=>p.pool))}</td>${partners().map(id => `<td class="r num">${hrs(sum(ytd,p=>p.people.find(q=>q.id===id)?.approved))}</td><td class="r num">${money2(sum(ytd,p=>p.people.find(q=>q.id===id)?.payout))}</td><td></td>`).join('')}<td class="r num">${money2(sum(ytd,p=>p.expTotal))}</td><td class="r num">${money2(sum(ytd,p=>p.contribution))}</td><td></td></tr></tfoot></table></div>
  <p class="muted" style="margin:10px 0 0">Months before the time log began (July 13) have revenue but no tracked hours, so their pool shows as unallocated.</p></div>
  <div class="panel" style="margin-top:14px"><h3>Compensation models <span class="muted">analysis only, never changes payouts</span></h3>${compModels(P)}</div>`;
};
function compModels(P){
  const m = P.m, from = m+'-01', to = monthEnd(m); const ids = partners();
  const rows = laborRows().filter(r => inRange(r.date, from, to) && r.status==='approved' && r.payoutEligible && ids.includes(r.personId));
  const cxW = {Low:.8, Standard:1, High:1.3};
  const lvlW = l => ({1:.6, 2:.8, 3:1, 4:1.25})[l] || 1;
  const w = (fn) => ids.map(id => sum(rows.filter(r => r.personId===id), fn));
  const clientRev = {}; ledgerItems().forEach(l => { const p = paidIn(l, from, to); if (p && l.clientId) clientRev[l.clientId] = (clientRev[l.clientId]||0) + p; });
  const clientMin = groupBy(rows, r => r.clientId);
  const revAttr = ids.map(id => sum(Object.entries(clientRev), ([c, rev]) => { const all = sum(clientMin[c]||[], r=>r.minutes); const mine = sum((clientMin[c]||[]).filter(r=>r.personId===id), r=>r.minutes); return all ? rev*mine/all : 0; }));
  const models = [
    ['Raw hours (current)', w(r => r.minutes)],
    ['Complexity-weighted hours', w(r => r.minutes * (cxW[entryById(r.entryId)?.complexity] || 1))],
    ['Deliverable points (planning std × units)', w(r => r.units ? r.units * (ttype(r.typeId)?.planHours||0) : 0)],
    ['Revenue-attributed', revAttr],
    ['Hybrid: 50% hours, 50% revenue', ids.map((id,i) => { const h = w(r=>r.minutes), H = sum(h), R = sum(revAttr); return (H? .5*h[i]/H : 0) + (R ? .5*revAttr[i]/R : 0); })],
    ['Role-weighted hours (task level)', w(r => r.minutes * lvlW(ttype(r.typeId)?.level))],
  ];
  return `<p class="muted" style="margin:0 0 10px">Raw hours can reward taking longer. These show how the same ${money2(P.pool)} pool would split under other rules. Deliverable points only count entries with a unit count.</p>
  <div class="tw"><table><thead><tr><th>Model</th>${ids.map(id => `<th class="r">${esc(person(id).name)}</th>`).join('')}<th class="r">Difference vs current</th></tr></thead><tbody>
  ${models.map(([name, ws], k) => { const pays = splitCents(P.pool, ws.map(x => Math.max(0,x))); const base = splitCents(P.pool, models[0][1]); const has = sum(ws) > 0;
    return `<tr><td>${esc(name)}</td>${ids.map((id,i) => `<td class="r num">${has ? money2(pays[i]) : '<span class="muted">no data</span>'}</td>`).join('')}<td class="r num">${k && has ? ids.map((id,i) => `${esc(person(id).name)} ${(pays[i]-base[i])>=0?'+':''}${money(pays[i]-base[i])}`).join(' · ') : '–'}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}

async function saveFinForm(clearFlag, del){
  const {kind, x} = UI.fin; const err = $('#fx-err');
  const reason = $('#fx-reason')?.value?.trim() || '';
  if (x.id && kind !== 'contracts' && !reason) return err.textContent = 'Give a reason. Revenue and expense changes affect payouts.';
  if (del){ x.deleted = true; }
  else for (const k of FIN_FIELDS[kind]){
    const el = $('#fx-'+k); if (!el) continue;
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.type === 'number') v = v === '' ? null : +v;
    if (v === '') v = null;
    x[k] = v;
  }
  if (!del){
    if (kind === 'ledger'){ if (!(x.amount > 0)) return err.textContent = 'Enter an amount.'; if (x.status==='paid' && !x.paidDate) return err.textContent = 'Paid revenue needs a payment date.'; if (x.status==='paid' && !x.paidAmount) x.paidAmount = x.amount; x.clientName = x.clientId ? clientName(x.clientId) : (x.clientName || ''); if (x.revenueType==='other income') x.poolEligible = false; }
    if (kind === 'contracts'){ if (!x.clientId || !x.start || !(x.amount > 0)) return err.textContent = 'Client, start date and amount are required.'; x.billingDay ||= +x.start.slice(8,10); }
    if (kind === 'expenses'){ if (!x.vendor || !(x.amount > 0) || !x.date) return err.textContent = 'Vendor, amount and date are required.'; if (x.recurring && !x.frequency) x.frequency = 'monthly'; }
    if (clearFlag){ x.needsReview = false; x.reviewNotes = []; }
  }
  const locked = kind !== 'contracts' && [x.paidDate, x.date, x.invoiceDate].filter(Boolean).some(d => isLocked(monthOf(d)));
  if (locked && x.id) return err.textContent = 'This falls in a locked payment period. Unlock it on Payouts first.';
  try { await saveFin(kind, x, reason || (del ? 'Deleted' : ''), FIN_FIELDS[kind].concat(['deleted'])); closeModal(); toast(del ? 'Deleted' : 'Saved'); }
  catch (e){ err.textContent = e.message || 'Could not save.'; }
}

async function onClick(ev){
  if (!ev.target.closest('.combo')) closeCombos();
  const a = ev.target.closest('[data-act],[data-go],[data-f],[data-pick]'); if (!a) return;
  if (a.dataset.go){ ev.preventDefault(); return go(a.dataset.go); }
  if (a.dataset.f){ return setF({[a.dataset.f]: a.dataset.v}); }
  if (a.dataset.pick){ return; }   // handled on mousedown
  const act = a.dataset.act, id = a.dataset.id;
  try {
  switch (act){
    case 'scrim': if (ev.target === a && UI.downOnScrim) closeModal(); break;   // only a full click on the backdrop closes
    case 'close': closeModal(); break;
    case 'claim': await claimPerson(id); break;
    case 'theme': { const cur = document.documentElement.dataset.theme; const nx = !cur ? 'dark' : cur === 'dark' ? 'light' : ''; if (nx) document.documentElement.dataset.theme = nx; else delete document.documentElement.dataset.theme; lsSet('theme', nx); render(); break; }
    case 'start': openStart(); break;
    case 'scope-pick': {
      const sc = a.dataset.scope;
      UI.startScope = sc;
      const sw = $('#st-scope'); if (sw) sw.dataset.scope = sc;
      document.querySelectorAll('#st-scope .seg-b').forEach(b => b.classList.toggle('on', b.dataset.scope === sc));
      $('#st-fields').innerHTML = startFields(sc, {});
      $('#st-err').textContent = '';
      ($('#st-client') || $('#st-cat'))?.focus();
      break;
    }
    case 'tax-scope': UI.taxScope = a.dataset.scope; render(); break;
    case 'tax-new-cat': openCatModal(null, a.dataset.scope); break;
    case 'tax-edit-cat': openCatModal(a.dataset.id); break;
    case 'tax-save-cat': await saveCat(a.dataset.id); break;
    case 'tax-new-type': openTypeModal(null, a.dataset.cat); break;
    case 'tax-edit-type': openTypeModal(a.dataset.code); break;
    case 'tax-save-type': await saveType(a.dataset.code); break;
    case 'bill-add': openBillModal(a.dataset.id); break;
    case 'bill-save': await saveBill(a.dataset.id); break;
    case 'admin-tab': UI.adminTab = a.dataset.tab; render(); break;
    case 'start-go': await startGo(); break;
    case 'quickstart': await startTimer({clientId:a.dataset.c, typeId:a.dataset.t}); break;
    case 'pause': await pauseTimer(); break;
    case 'resume': await resumeTimer(); break;
    case 'stop': stopTimer(); break;
    case 'log': openEntryEditor({personId:S.personId, date:today(), start:Date.now()-3600e3, end:Date.now(), status:'draft', source:'lucid', payoutEligible:true, billable:false}); break;
    case 'edit': { const e = entryById(id); if (e) openEntryEditor(e); break; }
    case 'ed-save': await saveEditor(a.dataset.status); break;
    case 'ed-discard': if (a.dataset.confirm){ await S.db.doc('timers/'+S.personId).set({running:false, updatedAt:Date.now()}); closeModal(); toast('Session discarded'); } else { a.dataset.confirm = '1'; a.textContent = 'Discard for sure'; } break;
    case 'ed-delete': {
      if (!a.dataset.confirm){ a.dataset.confirm = '1'; a.textContent = 'Confirm delete'; break; }
      const e = entryById(UI.edit.e.id); const reason = $('#ed-reason')?.value?.trim();
      if (e.status === 'approved' && !reason){ $('#ed-err').textContent = 'Give a reason before deleting approved time.'; break; }
      await upsertItem('entries', monthOf(e.date), e.id, {...e, deleted:true}); await audit('entry', e.id, [{field:'deleted', from:false, to:true}], reason||'', {payoutImpact:e.status==='approved'}); closeModal(); toast('Deleted'); break; }
    case 'alloc-add': readEditor(); UI.edit.e.allocations.push({clientId:UI.edit.e.clientId, typeId:UI.edit.e.typeId || Object.keys(S.taxonomy.types)[0], minutes:15, attention:'active'}); renderAllocs(); updateDur(); break;
    case 'alloc-del': UI.edit.e.allocations.splice(+a.dataset.i, 1); renderAllocs(); updateDur(); break;
    case 'status': await setStatus([id], a.dataset.s); break;
    case 'reject': openModal(`<header><h2>Send back</h2><button class="btn ghost" data-act="close">Close</button></header><div class="body"><label class="field"><span>What needs fixing?</span><input class="in" id="rj-reason" autofocus></label></div><footer><span></span><button class="btn pri" data-act="reject-go" data-id="${id}">Send back</button></footer>`); break;
    case 'reject-go': await setStatus([id], 'rejected', $('#rj-reason').value); closeModal(); break;

async function importFile(file){
  const msg = $('#imp-msg'); if (!window.XLSX){ msg.textContent = 'Spreadsheet library is still loading.'; return; }
  try {
    const wb = XLSX.read(await file.arrayBuffer(), {cellDates:true}); const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {raw:true, defval:null});
    const key = k => Object.keys(rows[0]||{}).find(c => c.toLowerCase().replace(/\s/g,'').startsWith(k));
    const K = {date:key('date'), name:key('name'), start:key('start'), end:key('end'), cat:key('category'), task:key('task')};
    if (!K.date || !K.name || !K.start || !K.end){ msg.textContent = 'Couldn\'t find Date, Name, Start and End columns.'; return; }
    const toDate = v => v instanceof Date ? v.toISOString().slice(0,10) : typeof v === 'number' ? new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10) : String(v||'').slice(0,10);
    const toTime = v => { if (v instanceof Date) return v.toISOString().slice(11,16); if (typeof v === 'number'){ const m = Math.round((v%1)*1440); return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); } const s = String(v||'').trim(); const mm = s.match(/(\d{1,2}):(\d{2})\s*([ap]m)?/i); if (!mm) return null; let h = +mm[1]; if (mm[3]) h = h%12 + (/p/i.test(mm[3])?12:0); return String(h).padStart(2,'0')+':'+mm[2]; };
    const existing = new Set(allEntries().map(e => e.personId+'|'+e.start+'|'+e.end));
    let added = 0, skipped = 0;
    for (const r of rows){
      const d = toDate(r[K.date]), st = toTime(r[K.start]), en = toTime(r[K.end]); const pid = String(r[K.name]||'').trim().toLowerCase();
      if (!d || !st || !en || !S.people[pid]){ skipped++; continue; }
      const start = zoned(d, st); let end = zoned(d, en); if (end <= start) end = zoned(addDays(d,1), en);
      if (existing.has(pid+'|'+start+'|'+end)){ skipped++; continue; }
      const text = String(r[K.task]||''); const low = ' '+text.toLowerCase()+' ';
      const cid = Object.entries(S.clients).find(([,c]) => (c.aliases||[]).some(a => a && low.includes(a.trim())))?.[0] || null;
      const e = {id:uid('imp'), personId:pid, date:d, start, end, minutes:Math.round((end-start)/60000), clientId:cid, typeId:null, note:text, source:'import', importRef:`${file.name}`, importRaw:{category:r[K.cat]||'', task:text},
        status:'draft', needsReview:true, reviewNotes:['Imported: choose the task type'], billable:false, payoutEligible:true, joint:false};
      await upsertItem('entries', monthOf(d), e.id, e); existing.add(pid+'|'+start+'|'+end); added++;
    }
    await audit('import', file.name, [{field:'rows added', from:null, to:added}], `Imported ${file.name}`);
    msg.textContent = `Added ${added} rows as drafts in Time Log. Skipped ${skipped} (already imported or incomplete).`;
  } catch (e){ msg.textContent = 'Couldn\'t read that file: ' + (e.message||''); }
}
